services:
  hexosite:
    image: hexosite
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: development
    ports:
      - 3000:3000
      - 9229:9229
    command:
      [
        "node",
        "--inspect=0.0.0.0:9229",
        "./node_modules/hexo/bin/hexo",
        "server",
        "--port",
        "3000",
      ]
